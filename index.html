function drawPnlSparkline(settled) {
  const canvas = document.getElementById('pnlSparkline');
  if (!canvas || !settled.length) return;
  const W = canvas.offsetWidth || 300;
  const H = 80;
  canvas.width = W * window.devicePixelRatio;
  canvas.height = H * window.devicePixelRatio;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

  // Build cumulative P&L array (oldest first)
  const bets = [...settled].reverse();
  let running = 0;
  const points = [0, ...bets.map(b => {
    running += b.status==='won' ? b.potential_payout-b.stake : b.status==='lost' ? -b.stake : 0;
    return running;
  })];

  const minV = Math.min(...points), maxV = Math.max(...points);
  const range = maxV - minV || 1;
  const pad = { l:4, r:4, t:8, b:8 };
  const toY = v => pad.t + (1 - (v - minV) / range) * (H - pad.t - pad.b);
  const toX = i => pad.l + (i / (points.length - 1)) * (W - pad.l - pad.r);

  // Zero line
  const zeroY = toY(0);
  ctx.setLineDash([3,3]);
  ctx.strokeStyle = 'rgba(255,255,255,.08)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad.l, zeroY); ctx.lineTo(W-pad.r, zeroY); ctx.stroke();
  ctx.setLineDash([]);

  // Gradient fill
  const lastV = points[points.length-1];
  const lineColor = lastV >= 0 ? '#30D158' : '#FF3B30';
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, lastV >= 0 ? 'rgba(48,209,88,.25)' : 'rgba(255,59,48,.2)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');

  ctx.beginPath();
  ctx.moveTo(toX(0), toY(points[0]));
  for (let i = 1; i < points.length; i++) ctx.lineTo(toX(i), toY(points[i]));
  ctx.lineTo(toX(points.length-1), H);
  ctx.lineTo(toX(0), H);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Line
  ctx.beginPath();
  ctx.moveTo(toX(0), toY(points[0]));
  for (let i = 1; i < points.length; i++) ctx.lineTo(toX(i), toY(points[i]));
  ctx.strokeStyle = lineColor;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // End dot
  ctx.beginPath();
  ctx.arc(toX(points.length-1), toY(points[points.length-1]), 4, 0, Math.PI*2);
  ctx.fillStyle = lineColor;
  ctx.fill();
}

function usernameGradient(name) {
  // Generate a consistent hue from the username
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
  const h2 = (h + 40) % 360;
  return `linear-gradient(135deg, hsl(${h},70%,45%), hsl(${h2},60%,35%))`;
}

let _balTween = null;
function animateBalance(targetVal) {
  const el = document.getElementById('headerBalance');
  if (!el) return;
  const fromStr = el.textContent.replace(/[^0-9.]/g,'');
  let from = parseFloat(fromStr) || 0;
  const to = targetVal;
  const dur = 500, start = performance.now();
  if (_balTween) cancelAnimationFrame(_balTween);
  const step = (now) => {
    const p = Math.min((now - start) / dur, 1);
    const ease = 1 - Math.pow(1-p, 3); // ease-out cubic
    el.textContent = fmt(from + (to - from) * ease);
    if (p < 1) _balTween = requestAnimationFrame(step);
    else { el.textContent = fmt(to); _balTween = null; }
  };
  _balTween = requestAnimationFrame(step);
}

function launchConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  if (!canvas) return;
  canvas.style.display = 'block';
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const colors = ['#F5A623','#FFD700','#30D158','#4A9EFF','#FF8C00','#C8FF57'];
  const particles = Array.from({length:80}, () => ({
    x: Math.random() * canvas.width,
    y: -10 - Math.random() * 40,
    vx: (Math.random()-0.5)*4,
    vy: 2 + Math.random()*4,
    color: colors[Math.floor(Math.random()*colors.length)],
    size: 5 + Math.random()*6,
    rot: Math.random()*360,
    rotV: (Math.random()-0.5)*8,
    life: 1,
  }));
  let frame = 0;
  const tick = () => {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive = false;
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.rot += p.rotV;
      p.vy += 0.08; p.life -= 0.008;
      if (p.life <= 0 || p.y > canvas.height) continue;
      alive = true;
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.5);
      ctx.restore();
    }
    if (alive && frame++ < 180) requestAnimationFrame(tick);
    else canvas.style.display = 'none';
  };
  requestAnimationFrame(tick);
}
function randomCode() {
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({length:6}, () => c[Math.floor(Math.random()*c.length)]).join('');
}

// ── ESPN SCOREBOARD (free, no key, no limits) ─────────────────────
async function fetchOdds(sport) {
  const cached = oddsCache[sport];
  if (cached && Date.now() - cached.ts < ODDS_TTL) return cached.data;
  const espnPath = SPORTS[sport]?.espn;
  if (!espnPath) return [];
  const isUFC = sport === 'mma_mixed_martial_arts';
  const isTennis = sport.startsWith('tennis_');
  try {
    const fmtDate = d => d.toISOString().slice(0,10).replace(/-/g,'');
    const today = new Date();

    const fetchDay = async d => {
      const url = `https://site.api.espn.com/apis/site/v2/sports/${espnPath}/scoreboard` +
                  (d ? `?dates=${fmtDate(d)}` : '');
      const res = await fetch(url).catch(() => null);
      return res?.ok ? (await res.json()).events || [] : [];
    };

    let events;
    if (isTennis) {
      // Tennis scoreboard doesn't support ?dates= filtering — fetch base URL only
      events = await fetchDay(null);
    } else {
      // Fetch today + next 6 days in parallel (covers full NFL week + MLB daily slate)
      const lookAheadDays = Array.from({length: 7}, (_, i) => {
        if (i === 0) return null;
        const d = new Date(today); d.setDate(today.getDate() + i); return d;
      });
      events = (await Promise.all(lookAheadDays.map(fetchDay))).flat();
    }

    // UFC events are weekly — if still nothing, scan further (up to 14 days)
    if (isUFC && !events.some(e => e.status?.type?.state === 'pre')) {
      for (let i = 7; i <= 14; i++) {
        const d = new Date(today); d.setDate(today.getDate() + i);
        const evs = await fetchDay(d);
        events = [...events, ...evs];
        if (evs.some(e => e.status?.type?.state === 'pre')) break;
      }
    }

    // Deduplicate by id
    const seen = new Set();
    events = events.filter(ev => { if (seen.has(ev.id)) return false; seen.add(ev.id); return true; });

    // Tennis: include 'in' (live) matches too — tournaments run round-by-round
    let upcoming = events.filter(ev => {
      const state = ev.status?.type?.state;
      return state === 'pre' || (isTennis && state === 'in');
    });

    // UFC main card: limit to first 5 fights of the soonest event day
    if (isUFC && upcoming.length) {
      upcoming.sort((a, b) => new Date(a.date) - new Date(b.date));
      const eventDay = upcoming[0].date.slice(0, 10);
      upcoming = upcoming.filter(ev => ev.date.slice(0, 10) === eventDay).slice(0, 5);
    }

    const data = upcoming.map(ev => {
      const comp = ev.competitions?.[0];
      if (!comp) return null;
      const cs = comp.competitors || [];
      // Team sports use homeAway; UFC has no homeAway — fall back to index
      const home = cs.find(c => c.homeAway === 'home') || cs[1];
      const away = cs.find(c => c.homeAway === 'away') || cs[0];
      if (!home || !away) return null;
      // Name: team sports → team.displayName; UFC → athlete.displayName
      const getName = c => c.team?.displayName || c.athlete?.displayName || c.displayName || '?';
      const homeName = getName(home);
      const awayName = getName(away);
      const getLogo = c => c.team?.logo || c.athlete?.headshot?.href || null;
      const homeLogo = getLogo(home);
      const awayLogo = getLogo(away);

      const o = comp.odds?.[0];
      const markets = [];
      if (o) {
        // Moneyline — ESPN stores as o.moneyline.home/away.close.odds (strings like "-118")
        const hML = parseInt(o.moneyline?.home?.close?.odds);
        const aML = parseInt(o.moneyline?.away?.close?.odds);
        if (!isNaN(hML) && !isNaN(aML)) {
          markets.push({ key:'h2h', outcomes:[
            { name:awayName, price:aML },
            { name:homeName, price:hML },
          ]});
        }
        // Spread — o.spread is already SIGNED (negative = home gives points, e.g. -1.5)
        // Juice lives at o.pointSpread.home/away.close.odds (strings)
        if (typeof o.spread === 'number') {
          const homePt = o.spread;
          const hSpOdds = parseInt(o.pointSpread?.home?.close?.odds ?? '-110');
          const aSpOdds = parseInt(o.pointSpread?.away?.close?.odds ?? '-110');
          markets.push({ key:'spreads', outcomes:[
            { name:awayName, price:isNaN(aSpOdds) ? -110 : aSpOdds, point:-homePt },
            { name:homeName, price:isNaN(hSpOdds) ? -110 : hSpOdds, point:homePt },
          ]});
        }
        // Total — line at o.overUnder, juice at o.total.over/under.close.odds (strings)
        if (o.overUnder != null) {
          const ovOdds = parseInt(o.total?.over?.close?.odds  ?? '-110');
          const unOdds = parseInt(o.total?.under?.close?.odds ?? '-110');
          markets.push({ key:'totals', outcomes:[
            { name:'Over',  price:isNaN(ovOdds) ? -110 : ovOdds, point:o.overUnder },
            { name:'Under', price:isNaN(unOdds) ? -110 : unOdds, point:o.overUnder },
          ]});
        }
      }
      return {
        id: ev.id, home_team: homeName, away_team: awayName,
        home_logo: homeLogo, away_logo: awayLogo,
        commence_time: ev.date,
        isLive: ev.status?.type?.state === 'in',
        bookmakers: markets.length ? [{ key:'espn', markets }] : [],
      };
    }).filter(Boolean);

    oddsCache[sport] = { data, ts: Date.now() };
    return data;
  } catch(e) {
    console.error('ESPN scoreboard:', e);
    showToast('Could not load games — showing demo data', 'warn');
    return getMock(sport);
  }
}

    ],
  };
  return mocks[sport] || [];
}

function getMarket(game, key) {
  for (const bm of (game.bookmakers||[])) {
    const m = bm.markets?.find(m => m.key === key);
    if (m) return m.outcomes;
  }
  return null;
}

// ── PPL (PREMIER PADEL) ───────────────────────────────────────────
function probToAmericanOdds(p) {
  // p is 0-100
  if (p >= 50) return Math.round(-(p / (100 - p)) * 100);
  return Math.round(((100 - p) / p) * 100);
}

async function fetchPPL() {
  if (pplCache && Date.now() - pplCacheTs < PPL_TTL) return pplCache;
  const weekAgo = new Date(Date.now() - 7*24*60*60*1000).toISOString().split('T')[0];
  const hdrs = { 'Authorization': `Bearer ${PPL_API_KEY}`, 'Content-Type': 'application/json' };
  try {
    // Get current/upcoming P1 (Premier Padel Tour) tournaments
    const tr = await fetch(`${PPL_BASE}/tournaments?level=p1&after_date=${weekAgo}&sort_by=start_date&order_by=asc&per_page=5`, { headers: hdrs });
    if (!tr.ok) throw new Error(tr.status);
    const { data: tournaments } = await tr.json();
    const activeTourneys = tournaments.filter(t => t.status === 'live' || t.status === 'pending' || t.status === 'scheduled');
    // Store next tournament for empty-state display
    pplNextTourney = activeTourneys[0] || null;
    // Fetch matches from each active P1 tournament
    const today = new Date().toISOString().split('T')[0];
    const allMatches = (await Promise.all(activeTourneys.map(async t => {
      const mr = await fetch(`${PPL_BASE}/tournaments/${t.id}/matches?after_date=${today}&sort_by=played_at&order_by=asc&per_page=30`, { headers: hdrs });
      if (!mr.ok) return [];
      const { data } = await mr.json();
      return data;
    }))).flat();
    const scheduled = allMatches.filter(m => m.status === 'scheduled' && m.players?.team_1?.length && m.players?.team_2?.length);
    const withOdds = await Promise.all(scheduled.map(async m => {
      const [t1label, t2label] = m.name.split(' - ');
      const t1ids = m.players.team_1.map(p => p.id);
      const t2ids = m.players.team_2.map(p => p.id);
      let t1odds = -110, t2odds = -110;
      try {
        const sr = await fetch(`${PPL_BASE}/matches/simulate`, { method:'POST', headers:hdrs, body:JSON.stringify({team_1:t1ids,team_2:t2ids}) });
        const sim = await sr.json();
        t1odds = probToAmericanOdds(sim.probability.team_1);
        t2odds = probToAmericanOdds(sim.probability.team_2);
      } catch(e) {
        // fallback: use seeds
        const s1 = parseInt(m.seeds?.team_1)||2, s2 = parseInt(m.seeds?.team_2)||2;
        if (s1 < s2) { t1odds = -140; t2odds = +120; }
        else if (s2 < s1) { t1odds = +120; t2odds = -140; }
      }
      return {
        id: `ppl_${m.id}`,
        home_team: t2label || 'Team 2',
        away_team: t1label || 'Team 1',
        commence_time: m.scheduled_at || m.played_at,
        bookmakers: [{ key:'ppl', markets: [{ key:'h2h', outcomes:[
          { name: t1label || 'Team 1', price: t1odds },
          { name: t2label || 'Team 2', price: t2odds },
        ]}]}]
      };
    }));
    pplCache = withOdds; pplCacheTs = Date.now();
    return withOdds;
  } catch(e) {
    console.error('PPL API:', e);
    showToast('Could not load PPL matches', 'warn');
    return [];
  }
}

function renderBoosts(games) {
  const wrap = document.getElementById('boostsSection');
  const scroll = document.getElementById('boostsScroll');
  if (!wrap || !scroll) return;
  const sh = s => { let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))&0xFFFFFFFF; return h>>>0; };
  const mlGames = games.filter(g => getMarket(g,'h2h'));
  if (!mlGames.length) { wrap.style.display='none'; return; }
  wrap.style.display = 'block';
  const items = [];
  mlGames.slice(0,6).forEach((g, i) => {
    const ml = getMarket(g,'h2h');
    const sp = getMarket(g,'spreads');
    const tot = getMarket(g,'totals');
    const awayShort = g.away_team.split(' ').pop();
    const homeShort = g.home_team.split(' ').pop();
    // ML boost — pick favorite or underdog based on seed
    const fav = ml[0].price <= ml[1].price ? ml[0] : ml[1];
    const dog = ml[0].price > ml[1].price ? ml[0] : ml[1];
    const useFav = sh(g.id+'bfav'+i) % 3 > 0; // favor favorites 2:1
    const pick = useFav ? fav : dog;
    const orig = pick.price;
    const boost = orig > 0 ? Math.min(Math.round((orig * 1.18)/5)*5, 800)
                           : Math.max(Math.round((orig * 0.85)/5)*5, -130);
    items.push({ g, market:'h2h', sel:pick.name, orig, boost,
      label: pick.name.split(' ').slice(-1)[0] + ' Moneyline',
      sublabel: awayShort + ' @ ' + homeShort });
    // Spread boost
    if (sp && sp[0] && i < 4) {
      const spO = sh(g.id+'bsp'+i) % 2 === 0 ? sp[0] : (sp[1]||sp[0]);
      const spBoost = spO.price > 0 ? Math.min(Math.round(spO.price*1.2/5)*5, 600)
                                    : Math.max(Math.round(spO.price*0.83/5)*5, -115);
      items.push({ g, market:'spreads', sel:spO.name, orig:spO.price, boost:spBoost,
        label: spO.name.split(' ').pop() + ' ' + (spO.point>0?'+':'') + spO.point,
        sublabel: 'Spread Boost' });
    }
    // Total boost
    if (tot && tot[0] && i < 2) {
      const totO = tot[0];
      const totBoost = totO.price > 0 ? Math.round(totO.price*1.2/5)*5 : Math.max(totO.price+18,-105);
      items.push({ g, market:'totals', sel:totO.name, orig:totO.price, boost:totBoost,
        label: totO.name + ' ' + totO.point,
        sublabel: 'Total Points Boost' });
    }
  });
  scroll.innerHTML = items.slice(0,6).map(b => {
    const inSlip = betSlipLegs.some(l => l.gameId===b.g.id&&l.market===b.market&&l.selection===b.sel&&l.odds===b.boost);
    return `<div class="boost-card">
      <div class="boost-badge">🚀 BOOSTED</div>
      <div class="boost-label">${esc(b.label)}</div>
      <div class="boost-game">${esc(b.sublabel)}</div>
      <div class="boost-odds-row">
        <span class="boost-orig">${fmtOdds(b.orig)}</span>
        <button class="boost-btn odds-btn${inSlip?' in-slip':''}"
          data-gid="${esc(b.g.id)}" data-market="${esc(b.market)}"
          data-sel="${esc(b.sel)}" data-odds="${b.boost}" data-line=""
          data-home="${esc(b.g.home_team)}" data-away="${esc(b.g.away_team)}"
          data-ct="${esc(b.g.commence_time)}">${fmtOdds(b.boost)}</button>
      </div>
    </div>`;
  }).join('');
}

  const todayStr = nowLocal.toLocaleDateString('en-US');
  const tmrDate = new Date(nowLocal); tmrDate.setDate(tmrDate.getDate()+1);
  const tmrStr = tmrDate.toLocaleDateString('en-US');
  const smartLabel = (ct) => {
    const d = new Date(ct);
    const dStr = d.toLocaleDateString('en-US');
    const diffDays = Math.floor((d - nowLocal) / 86400000);
    if (dStr === todayStr) return 'Tonight';
    if (dStr === tmrStr) return 'Tomorrow';
    if (diffDays < 7) return d.toLocaleDateString('en-US',{weekday:'long'});
    return d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
  };
  const byDate = {};
  for (const g of sorted) {
    const key = smartLabel(g.commence_time);
    (byDate[key] = byDate[key]||[]).push(g);

  let html = '';
  const accentColor = SPORT_ACCENTS[currentSport] || 'var(--gold)';

  };

  const mlH = ml ? `${oddsBtn('h2h', ml.find(o=>o.name===away)||ml[0])}${oddsBtn('h2h', ml.find(o=>o.name===home)||ml[1])}` : '<span class="no-odds">TBD</span>';
  const spH = sp ? `${oddsBtn('spreads', sp.find(o=>o.name===away)||sp[0])}${oddsBtn('spreads', sp.find(o=>o.name===home)||sp[1])}` : '<span class="no-odds">TBD</span>';
  const totH = tot ? `${oddsBtn('totals', tot.find(o=>o.name==='Over')||tot[0])}${oddsBtn('totals', tot.find(o=>o.name==='Under')||tot[1])}` : '<span class="no-odds">TBD</span>';

  // Community pick % bars (seeded)
  const ppHash = s => { let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; };
  const mlPct = 38 + ppHash(g.id+'ml') % 25; // 38-62%
  const spPct = 40 + ppHash(g.id+'sp') % 22; // 40-62%
  const ovPct = 38 + ppHash(g.id+'tot') % 26; // 38-64%
  const ppBar = (pct, lA, lB) => `<div class="pick-pct-wrap">
    <div class="pick-pct-bar"><div class="ppb-a" style="width:${pct}%"></div><div class="ppb-b" style="width:${100-pct}%"></div></div>
    <div class="pick-pct-labels"><span>${pct}% ${esc(lA)}</span><span>${esc(lB)} ${100-pct}%</span></div>
  </div>`;
  const awayShortP = away.split(' ').pop(), homeShortP = home.split(' ').pop();

  const marketsHtml = isVersus
    ? `<div class="market-col" style="grid-column:1/-1"><div class="market-lbl">Moneyline</div><div class="odds-pair">${mlH}</div>${ppBar(mlPct,awayShortP,homeShortP)}</div>`
    : `<div class="market-col"><div class="market-lbl">Moneyline</div><div class="odds-pair">${mlH}</div>${ppBar(mlPct,awayShortP,homeShortP)}</div>
       <div class="market-col"><div class="market-lbl">Spread</div><div class="odds-pair">${spH}</div>${ppBar(spPct,awayShortP,homeShortP)}</div>
       <div class="market-col"><div class="market-lbl">Total</div><div class="odds-pair">${totH}</div>${ppBar(ovPct,'Over','Under')}</div>`;

  const liveBadge = g.isLive ? `<span class="live-badge"><span class="live-dot"></span>LIVE</span>` : '';
  const accent = SPORT_ACCENTS[currentSport] || 'var(--gold)';
  const soonMs = new Date(g.commence_time) - Date.now();
  const soonLabel = !g.isLive && soonMs > 0 && soonMs < 2*3600*1000
    ? `<span class="soon-badge">~${Math.round(soonMs/60000)}m</span>` : '';

  const awayLogoHtml = g.away_logo ? `<img class="team-logo" src="${esc(g.away_logo)}" alt="" loading="lazy" onerror="this.style.display='none'">` : '';
  const homeLogoHtml = g.home_logo ? `<img class="team-logo" src="${esc(g.home_logo)}" alt="" loading="lazy" onerror="this.style.display='none'">` : '';

  // Win probability bar
  let winProbBar = '';
  if (ml && ml.length >= 2 && !isVersus) {
    const aO = ml.find(o=>o.name===away) || ml[0];
    const hO = ml.find(o=>o.name===home) || ml[1];
    const implP = odds => odds < 0 ? Math.abs(odds)/(Math.abs(odds)+100) : 100/(odds+100);
    const pA = implP(aO.price), pH = implP(hO.price);
    const awayPct = Math.round(pA/(pA+pH)*100);
    const homePct = 100 - awayPct;
    winProbBar = `<div class="win-prob-bar" title="${esc(away)}: ${awayPct}% | ${esc(home)}: ${homePct}%">
      <div class="wpb-away" style="width:${awayPct}%"></div>
      <div class="wpb-home" style="width:${homePct}%"></div>
    </div>
    <div class="wpb-labels"><span>${awayPct}%</span><span>${homePct}%</span></div>`;
  }

  // Generate seeded game-level props
  const propsHtml = PROP_SPORTS[currentSport] ? generatePlayerProps(g) : '';

  // Hot badge — seeded "activity score" above threshold
  let _hotHash = 0; for (let i=0;i<g.id.length;i++) _hotHash = (_hotHash*31 + g.id.charCodeAt(i)) >>> 0;
  const isHot = (_hotHash % 5) === 0; // ~20% of games get the 🔥 badge
  const hotBadge = isHot ? `<span class="hot-badge">🔥 Hot</span>` : '';

  // Seeded team season records + streak
  const recHash = n => { let h=0; for(let i=0;i<n.length;i++) h=(h*31+n.charCodeAt(i))>>>0; return h; };
  const teamRec = n => { const w=4+(recHash(n)%13); return `${w}-${16-w}`; };
  const teamStreak = n => {
    const h = recHash(n+'streak');
    const len = 1+(h%5);
    const isW = (h>>8)%2===0;
    const cls = isW ? 'streak-w' : 'streak-l';
    return `<span class="team-streak ${cls}">${isW?'W':'L'}${len}</span>`;
  };

  // Live score display (seeded from game ID)
  let liveScoreHtml = '';
  if (g.isLive && !isVersus) {
    const sh2 = s => { let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; };
    const aS = sh2(g.id+'as') % 31, hS = sh2(g.id+'hs') % 35;
    const qNames = ['Q1','Q2','Q3','Q4','OT']; const qtr = qNames[sh2(g.id+'q') % 5];
    const aLead = aS > hS, hLead = hS > aS;
    liveScoreHtml = `<div class="live-score-wrap">
      <div class="live-score-row"><span class="live-score-val${aLead?' live-score-lead':''}">${aS}</span></div>
      <div class="live-score-row"><span class="live-score-val${hLead?' live-score-lead':''}">${hS}</span></div>
      <div class="live-period">${qtr}</div>
    </div>`;
  }

  return `<div class="game-card${g.isLive?' is-live':''}" style="--sport-accent:${accent}">
    <div class="game-card-accent-bar"></div>
    <div class="game-card-top">
      <div class="game-teams">
        <div class="team-row away">${awayLogoHtml}<span>${esc(away)}</span><span class="team-record">${teamRec(away)}</span>${teamStreak(away)}</div>
        <div class="team-row home">${homeLogoHtml}<span>${isVersus ? 'vs' : '@'} ${esc(home)}</span><span class="team-record">${teamRec(home)}</span>${teamStreak(home)}</div>
      </div>
      ${liveScoreHtml ? liveScoreHtml : `<div class="game-meta">${liveBadge}${soonLabel}${hotBadge}<div class="game-time">${time}</div></div>`}
    </div>
    ${winProbBar}
    <div class="game-markets">${marketsHtml}</div>
    ${propsHtml ? `
    <div class="more-markets-toggle" onclick="toggleProps(this)">
      <span>Player Props &amp; More</span><span class="mm-arrow">›</span>
    </div>
    <div class="game-props" style="display:none;padding:12px 14px">${propsHtml}</div>` : ''}
  </div>`;
}

// ── BET SLIP ──────────────────────────────────────────────────────
document.addEventListener('click', e => {
  const btn = e.target.closest('.odds-btn');
  if (!btn) return;
  const leg = {
    gameId: btn.dataset.gid, homeTeam: btn.dataset.home, awayTeam: btn.dataset.away,
    commenceTime: btn.dataset.ct, market: btn.dataset.market,
    selection: btn.dataset.sel, odds: parseInt(btn.dataset.odds),
    line: btn.dataset.line ? parseFloat(btn.dataset.line) : null,
  };
  toggleLeg(leg, btn, e);
});

function spawnRipple(btn, e) {
  if (!btn) return;
  const rect = btn.getBoundingClientRect();
  const x = (e?.clientX ?? rect.left + rect.width/2) - rect.left;
  const y = (e?.clientY ?? rect.top + rect.height/2) - rect.top;
  const r = document.createElement('span');
  const size = Math.max(rect.width, rect.height) * 1.8;
  Object.assign(r.style, {
    position:'absolute', width:size+'px', height:size+'px',
    left: (x-size/2)+'px', top: (y-size/2)+'px',
    borderRadius:'50%', transform:'scale(0)', opacity:'.4',
    background:'rgba(245,166,35,.5)', pointerEvents:'none',
    animation:'ripplePop .55s ease-out forwards'
  });
  btn.style.position = btn.style.position || 'relative';
  btn.style.overflow = 'hidden';
  btn.appendChild(r);
  setTimeout(() => r.remove(), 600);
}

function toggleLeg(leg, triggerBtn, evt) {
  if (!profile) { showToast('Sign in to bet', 'error'); return; }
  spawnRipple(triggerBtn, evt);
  const key = legKey(leg);
  const idx = betSlipLegs.findIndex(l => legKey(l) === key);
  if (idx > -1) {
    // Already in slip — remove it
    betSlipLegs.splice(idx, 1);
  } else {
    betSlipLegs.push(leg); // Allow multiple legs from same game (SGP)
  }
  updateFab();
  if (betSlipLegs.length === 0) { closeBetSlip(); return; }
  openBetSlip();
}

function updateFab() {
  const fab = document.getElementById('slipFab');
  const cnt = document.getElementById('fabCount');
  const n = betSlipLegs.length;
  if (fab) {
    fab.classList.toggle('visible', n > 0);
    // Dynamic label
    const gameIds = betSlipLegs.map(l=>l.gameId);
    const isSGP = n > 1 && gameIds.length !== new Set(gameIds).size;
    const label = n === 0 ? 'Bet Slip' : n === 1 ? 'Bet Slip' : isSGP ? 'SGP Builder' : 'Open Parlay';
    fab.childNodes[0].textContent = label + ' ';
  }
  if (cnt) cnt.textContent = n;
  // Re-sync in-slip class on all rendered odds buttons
  document.querySelectorAll('.odds-btn').forEach(btn => {
    const k = `${btn.dataset.gid}_${btn.dataset.market}_${btn.dataset.sel}`;
    btn.classList.toggle('in-slip', betSlipLegs.some(l => legKey(l) === k));
  });
}

function openBetSlip() {
  if (!betSlipLegs.length || !profile) return;
  const isMulti = betSlipLegs.length > 1;
  const isParlay = slipMode === 'parlay' && isMulti;
  const displayOdds = isParlay ? calcParlayOdds(betSlipLegs) : betSlipLegs[0].odds;

  const selLabel = (leg) => {
    if (leg.market==='spreads'&&leg.line!=null) return `${leg.selection} ${leg.line>0?'+':''}${leg.line}`;
    if (leg.market==='totals'&&leg.line!=null) return `${leg.selection} ${leg.line}`;
    return leg.selection;
  };

  // Mode toggle (only show when 2+ legs)
  const canRR = betSlipLegs.length >= 3;
  const modeToggle = isMulti ? `
    <div class="slip-mode-row">
      <button class="slip-mode-btn ${slipMode==='parlay'?'active':''}" onclick="setSlipMode('parlay')">Parlay</button>
      <button class="slip-mode-btn ${slipMode==='single'?'active':''}" onclick="setSlipMode('single')">Singles</button>
      ${canRR?`<button class="slip-mode-btn ${slipMode==='rr'?'active':''}" onclick="setSlipMode('rr')">Round Robin</button>`:''}
    </div>` : '';

  // Sport icon helper
  const sportIcon = () => SPORTS[currentSport]?.icon || '🎯';
  // Leg list
  const legsHtml = betSlipLegs.map((leg,i) => {
    const mktLabel = leg.market.startsWith('pp_') ? 'Player Prop'
      : leg.market.startsWith('gp_') ? 'Game Prop'
      : leg.market.startsWith('alt_') ? 'Alt Line'
      : leg.market.startsWith('live_') ? '🔴 Live'
      : leg.market.startsWith('futures_') ? '🏆 Future'
      : MARKET_LABELS[leg.market] || leg.market;
    return `<div class="slip-leg">
      <div class="sl-header">
        <span class="sl-sport">${sportIcon()}</span>
        <span class="sl-game">${esc(leg.awayTeam?.split(' ').pop()||leg.awayTeam||'')} @ ${esc(leg.homeTeam?.split(' ').pop()||leg.homeTeam||'')}</span>
        <button class="sl-remove" onclick="removeLeg(${i})" title="Remove">✕</button>
      </div>
      <div class="sl-pick">
        <span class="sl-market">${esc(mktLabel)}</span>
        <span class="sl-sel">${esc(selLabel(leg))}</span>
        <span class="bs-pick-odds ${leg.odds>0?'pos':'neg'}">${fmtOdds(leg.odds)}</span>
      </div>
    </div>`;
  }).join('');

  // Detect SGP (multiple legs from same game)
  const gameIds = betSlipLegs.map(l=>l.gameId);
  const hasSGP = gameIds.length !== new Set(gameIds).size;
  const parlayLabel = hasSGP ? 'Same-Game Parlay' : `${betSlipLegs.length}-Leg Parlay`;

  // Parlay summary bar
  const summaryBar = isParlay ? `
    <div class="parlay-summary">
      <div>
        <div style="font-size:13px;font-weight:800">${parlayLabel}</div>
        ${hasSGP ? `<div style="font-size:10px;color:var(--t3);margin-top:2px">Odds not correlation-adjusted</div>` : ''}
      </div>
      <span class="bs-pick-odds ${displayOdds>0?'pos':'neg'}">${fmtOdds(displayOdds)}</span>
    </div>` : '';

  // Round Robin combos (all 2-of-n)
  let rrHtml = '';
  if (slipMode === 'rr' && betSlipLegs.length >= 3) {
    const rrCombos = [];
    for (let i=0; i<betSlipLegs.length; i++) {
      for (let j=i+1; j<betSlipLegs.length; j++) {
        rrCombos.push([betSlipLegs[i], betSlipLegs[j]]);
      }
    }
    rrHtml = `<div class="rr-combos-count">${rrCombos.length} combos (2-of-${betSlipLegs.length})</div>
    <div class="rr-combo-list">${rrCombos.map(combo => {
      const odds = calcParlayOdds(combo);
      const a = selLabel(combo[0]).split(' ').slice(0,2).join(' ');
      const b = selLabel(combo[1]).split(' ').slice(0,2).join(' ');
      return `<div class="rr-combo">
        <span class="rr-combo-legs">${esc(a)} + ${esc(b)}</span>
        <span class="rr-combo-odds ${odds>0?'pos':'neg'}">${fmtOdds(odds)}</span>
      </div>`;
    }).join('')}</div>`;
  }

  document.getElementById('bsBody').innerHTML = `
    ${modeToggle}
    <div class="parlay-legs-list">${legsHtml}</div>
    ${summaryBar}
    ${rrHtml}
    <div class="bs-stake-lbl">${slipMode==='rr'?'Stake Per Combo':'Bet Amount'}</div>
    <div class="bs-amount-row"><span class="bs-dollar">$</span><input class="bs-input" id="bsStake" type="number" inputmode="numeric" min="1" value="50" oninput="updateBsPayout()" onkeydown="if(event.key==='Enter'){event.preventDefault();placeBet()}" autocomplete="off"></div>
    <div class="bs-quick">
      <button onclick="setBsStake(10)">$10</button>
      <button onclick="setBsStake(25)">$25</button>
      <button onclick="setBsStake(50)">$50</button>
      <button onclick="setBsStake(100)">$100</button>
      <button onclick="setBsStake(Math.floor(profile.balance))">Max</button>
    </div>
    <hr class="bs-divider">
    <div class="bs-payout-row"><span class="bs-payout-lbl">To Win</span><span class="bs-payout-val" id="bsToWin">—</span></div>
    <div class="bs-payout-row"><span class="bs-payout-lbl">Total Payout</span><span class="bs-payout-val" id="bsPayout">—</span></div>
    <div class="bs-balance">Balance: <b>${fmt(profile.balance)}</b></div>
    <button class="bs-place-btn" id="bsPlaceBtn" onclick="placeBet()">Place ${isParlay?'Parlay':'Bet'}</button>`;
  document.getElementById('betSlipWrap').style.display = 'flex';
  updateBsPayout();
  // Mobile swipe-to-dismiss
  const panel = document.querySelector('.bet-slip-panel');
  if (panel && window.innerWidth <= 600) {
    let startY = null;
    const onStart = e => { startY = e.touches[0].clientY; };
    const onMove = e => {
      if (startY === null) return;
      const dy = e.touches[0].clientY - startY;
      if (dy > 0) { panel.style.transform = `translateY(${dy}px)`; panel.style.transition = 'none'; }
    };
    const onEnd = e => {
      if (startY === null) return;
      const dy = e.changedTouches[0].clientY - startY;
      panel.style.transition = '';
      panel.style.transform = '';
      startY = null;
      if (dy > 100) closeBetSlip();
    };
    panel.addEventListener('touchstart', onStart, {passive:true});
    panel.addEventListener('touchmove', onMove, {passive:true});
    panel.addEventListener('touchend', onEnd, {passive:true});
  }
}

function setSlipMode(mode) { slipMode = mode; openBetSlip(); }

// ── CASH OUT ─────────────────────────────────────────────────────
async function cashOut(betId, coValue, origStake) {
  if (!profile) return;
  const profit = coValue - origStake;
  if (!confirm(`Cash out for ${fmt(coValue)}? (${profit >= 0 ? '+' : ''}${fmt(profit)} vs stake)`)) return;
  const newBal = profile.balance + coValue;
  const { error: be } = await sb.from('profiles').update({ balance: newBal }).eq('id', user.id);
  if (be) { showToast('Cash out failed', 'error'); return; }
  const { error: ue } = await sb.from('bets')
    .update({ status: 'won', potential_payout: coValue, settled_at: new Date().toISOString() })
    .eq('id', betId);
  if (ue) { await sb.from('profiles').update({ balance: profile.balance }).eq('id', user.id); showToast('Cash out failed', 'error'); return; }
  profile.balance = newBal;
  animateBalance(newBal);
  flashBalance('up');
  showToast(`Cashed out for ${fmt(coValue)} 💰`);
  loadMyBets();
}

async function doAddFunds(amt) {

function toggleOddsFormat() {
  oddsFormat = oddsFormat === 'american' ? 'decimal' : 'american';
  try { localStorage.setItem('chalk_odds_fmt', oddsFormat); } catch(e) {}
  const btn = document.getElementById('oddsFmtBtn');
  if (btn) btn.textContent = oddsFormat === 'american' ? 'AMR' : 'DEC';
  // Re-render all visible odds buttons
  if (currentView === 'games') loadGames(currentSport);
  updateBsPayout();
  openBetSlip(); // refresh slip display
}
function removeLeg(idx) {
  betSlipLegs.splice(idx, 1);
  updateFab();
  if (!betSlipLegs.length) { closeBetSlip(); return; }
  openBetSlip();
}

function setBsStake(v) { const i=document.getElementById('bsStake'); if(i){i.value=Math.min(v,Math.floor(profile?.balance||0)); updateBsPayout();} }
function setBsStakePct(pct) { setBsStake(Math.max(1, Math.floor((profile?.balance||0) * pct / 100))); }
function updateBsPayout() {
  const stake = parseFloat(document.getElementById('bsStake')?.value)||0;
  if (!betSlipLegs.length) return;
  const isParlay = slipMode === 'parlay' && betSlipLegs.length > 1;
  const isRR = slipMode === 'rr' && betSlipLegs.length >= 3;
  let totalWin = 0, totalPayout = 0;
  if (isRR) {
    for (let i=0; i<betSlipLegs.length; i++) for (let j=i+1; j<betSlipLegs.length; j++) {
      const p = calcPayout(stake, calcParlayOdds([betSlipLegs[i], betSlipLegs[j]]));
      totalPayout += p; totalWin += (p - stake);
    }
    const combosCount = betSlipLegs.length*(betSlipLegs.length-1)/2;
    document.getElementById('bsToWin').textContent = `Max ${fmt(totalWin)} (${combosCount} combos)`;
    document.getElementById('bsPayout').textContent = `Total wager: ${fmt(stake*combosCount)}`;
    return;
  }
  const odds = isParlay ? calcParlayOdds(betSlipLegs) : betSlipLegs[0].odds;
  const payout = calcPayout(stake, odds);
  document.getElementById('bsToWin').textContent = fmt(payout - stake);
  document.getElementById('bsPayout').textContent = fmt(payout);
}
function closeBetSlip() { document.getElementById('betSlipWrap').style.display='none'; }

async function placeBet() {
  if (!betSlipLegs.length||!profile) return;
  const stake = parseFloat(document.getElementById('bsStake')?.value)||0;
  if (stake <= 0) { showToast('Enter a valid stake','error'); return; }
  if (stake > profile.balance) { showToast('Insufficient balance','error'); return; }
  const btn = document.getElementById('bsPlaceBtn');
  btn.textContent = 'Placing…'; btn.disabled = true;

  const isParlay = slipMode === 'parlay' && betSlipLegs.length > 1;
  const odds = isParlay ? calcParlayOdds(betSlipLegs) : betSlipLegs[0].odds;
  const payout = calcPayout(stake, odds);
  const newBal = profile.balance - stake;

  const { error: be } = await sb.from('profiles').update({ balance: newBal }).eq('id', user.id);
  if (be) { btn.textContent='Place Bet'; btn.disabled=false; showToast('Error placing bet','error'); return; }

  let insertError;
  if (isParlay) {
    const leg0 = betSlipLegs[0];
    const { error: ie } = await sb.from('bets').insert({
      user_id: user.id, sport: currentSport,
      game_id: 'parlay', home_team: 'Parlay', away_team: `${betSlipLegs.length} Legs`,
      commence_time: leg0.commenceTime, market: 'parlay',
      selection: JSON.stringify({ legs: betSlipLegs }),
      line: null, odds, stake, potential_payout: payout,
    });
    insertError = ie;
  } else {
    const leg = betSlipLegs[0];
    const { error: ie } = await sb.from('bets').insert({
      user_id: user.id, sport: currentSport,
      game_id: leg.gameId, home_team: leg.homeTeam, away_team: leg.awayTeam,
      commence_time: leg.commenceTime, market: leg.market,
      selection: leg.selection, line: leg.line, odds: leg.odds,
      stake, potential_payout: payout,
    });
    insertError = ie;
  }

  if (insertError) {
    await sb.from('profiles').update({balance:profile.balance}).eq('id',user.id);
    btn.textContent='Place Bet'; btn.disabled=false;
    showToast('Error placing bet','error'); return;
  }

  profile.balance = newBal;
  animateBalance(newBal);
  const label = isParlay ? `${betSlipLegs.length}-leg parlay` : fmtOdds(odds);
  betSlipLegs = [];
  updateFab();
  closeBetSlip();
  flashBalance('dn'); // balance went down — flash red briefly
  showToast(`🎯 ${label} · Risking ${fmt(stake)} · To win ${fmt(payout-stake)}`);
  // Increment pending badge (we don't know count exactly but +1 is right)
  const curBadge = parseInt(document.getElementById('betsBadge')?.textContent||'0')||0;
  updateBetsBadge(curBadge + 1);
}

// ── MY BETS ───────────────────────────────────────────────────────
async function loadMyBets() {
  document.getElementById('betsInner').innerHTML = '<div class="loading"><div class="spinner"></div><span>Loading…</span></div>';
  await settlePending();
  const { data: bets } = await sb.from('bets').select('*').eq('user_id', user.id).order('created_at',{ascending:false});
  const all = bets||[];
  const pending = all.filter(b=>b.status==='pending');
  updateBetsBadge(pending.length);
  // Recompute wagered total and refresh tier
  totalWagered = all.reduce((acc,b)=>acc+Number(b.stake),0);
  updateTierChip();
  renderBets(all);
}

function updateTierChip() {
  const chip = document.getElementById('tierChip');
  if (!chip) return;
  const tier = getTier(totalWagered);
  chip.textContent = `${tier.icon} ${tier.name}`;
  chip.style.display = 'inline-flex';
  chip.style.color = tier.color;
  chip.style.borderColor = tier.color + '40';
}

function renderBets(bets) {
  const el = document.getElementById('betsInner');
  if (!bets.length) {
    el.innerHTML = `<div class="empty-state" style="padding:80px 30px">
      <div style="font-size:3rem;margin-bottom:12px">🎯</div>
      <b style="font-size:1.1rem;display:block;margin-bottom:8px">No bets yet</b>
      <div style="font-size:.85rem;color:var(--t3);margin-bottom:20px">Browse today's games and add picks to your slip</div>
      <button onclick="showView('games')" style="background:var(--gold);color:#000;border:none;border-radius:8px;padding:10px 24px;font-size:13px;font-weight:800;cursor:pointer;letter-spacing:.04em">Browse Games</button>
    </div>`;
    return;
  }
  const pending = bets.filter(b=>b.status==='pending');
  const settled = bets.filter(b=>b.status!=='pending');
  const pnl = settled.reduce((acc,b)=>acc+(b.status==='won'?b.potential_payout-b.stake:b.status==='lost'?-b.stake:0),0);

  const rb = b => {
    const isParlay = b.market === 'parlay';
    const mktL = isParlay ? `${JSON.parse(b.selection||'{}').legs?.length||'?'}-Leg Parlay` : (MARKET_LABELS[b.market]||b.market);
    const selL = isParlay ? '' : (b.market==='spreads'&&b.line!=null?`${b.selection} ${b.line>0?'+':''}${b.line}`:b.market==='totals'&&b.line!=null?`${b.selection} ${b.line}`:b.selection);
    const statusLabels = {won:'✓ WON',lost:'✗ LOST',push:'~ PUSH',pending:'⏳ PENDING'};
    const pnlVal = b.status==='won'?b.potential_payout-b.stake:b.status==='lost'?-b.stake:b.status==='push'?0:null;
    const d = new Date(b.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric'});

    let legsList = '';
    if (isParlay) {
      try {
        const legs = JSON.parse(b.selection).legs || [];
        legsList = `<div class="parlay-legs-count">${legs.map(l=>`<span>${esc(l.selection)} ${fmtOdds(l.odds)}</span>`).join(' · ')}</div>`;
      } catch(e) {}
    }

    const sportIcon = SPORTS[b.sport]?.icon || '';
    const matchupLine = isParlay
      ? `<div class="bet-matchup">${sportIcon} Parlay · ${fmtOdds(b.odds)}</div>`
      : `<div class="bet-matchup">${sportIcon ? sportIcon+' ' : ''}${esc(b.away_team)} @ ${esc(b.home_team)}</div>`;

    // Cash-out value = stake + 45% of potential profit (like real apps, slightly unfair)
    const coValue = b.status==='pending' ? Math.round((b.stake + (b.potential_payout - b.stake)*0.45)*100)/100 : null;
    const cashOutBtn = coValue ? `<button class="cashout-btn" onclick="cashOut('${b.id}',${coValue},${b.stake})">Cash Out ${fmt(coValue)}</button>` : '';

    // Live score overlay
    const liveKey = (b.home_team||'').toLowerCase();
    const liveInfo = b.status==='pending' && liveKey && _liveScoreMap[liveKey];
    const liveLine = liveInfo ? `<span class="bet-live-score"><span class="live-dot"></span>${liveInfo.awayTeam} ${liveInfo.awayScore}–${liveInfo.homeScore} ${liveInfo.homeTeam} <span style="opacity:.65">${esc(liveInfo.period)}</span></span>` : '';

    return `<div class="bet-card ${b.status}">
      <div class="bet-card-top">${matchupLine}<span class="bet-status-badge ${b.status}">${statusLabels[b.status]||b.status}</span></div>
      ${liveLine}
      ${isParlay ? legsList : `<div class="bet-pick">${esc(mktL)}: <b>${esc(selL)}</b> <span class="bet-odds">${fmtOdds(b.odds)}</span></div>`}
      <div class="bet-footer">
        <span>Stake: <b>${fmt(b.stake)}</b></span>
        ${pnlVal!==null?`<span class="${pnlVal>=0?'pos':'neg'}">${pnlVal>=0?'+':''}${fmt(pnlVal)}</span>`:`<span>To win: <b>${fmt(b.potential_payout-b.stake)}</b></span>`}
        <span class="bet-date">${d}</span>
      </div>
      ${cashOutBtn}
    </div>`;
  };

  // Stats bar
  const won = settled.filter(b=>b.status==='won').length;
  const total = settled.length;
  const winPct = total ? Math.round((won/total)*100) : 0;
  const statsBar = `<div class="bet-filter-tabs">
    <span style="color:var(--t2);font-size:13px">${pending.length} Active</span>
    <span style="color:var(--t2);font-size:13px">${won}/${total} Won (${winPct}%)</span>
    <span class="${pnl>=0?'pos':'neg'};font-size:13px">${pnl>=0?'+':''}${fmt(pnl)} P&amp;L</span>
  </div>`;

  let html = statsBar;
  if (pending.length) html += `<div class="bets-section-hdr">Active (${pending.length})</div>${pending.map(rb).join('')}`;
  if (settled.length) html += `<div class="bets-section-hdr">History <span class="bets-pnl ${pnl>=0?'pos':'neg'}">${pnl>=0?'+':''}${fmt(pnl)}</span></div>${settled.map(rb).join('')}`;
  el.innerHTML = html;
}

// ── SETTLEMENT ────────────────────────────────────────────────────
async function settlePending() {
  const now = new Date().toISOString();
  const { data: pending } = await sb.from('bets').select('*').eq('user_id',user.id).eq('status','pending').lt('commence_time',now);
  if (!pending?.length) return;
  const bySport = pending.reduce((acc,b)=>{(acc[b.sport]=acc[b.sport]||[]).push(b);return acc},{});
  for (const [sport, bets] of Object.entries(bySport)) {
    const espn = SPORTS[sport]?.espn; if (!espn) continue;
    try {
      const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${espn}/scoreboard`);
      const { events=[] } = await res.json();
      for (const bet of bets) {
        const ev = matchEvent(events, bet.home_team, bet.away_team); if (!ev) continue;
        if (!ev.status?.type?.completed) continue;
        const comps = ev.competitions?.[0]?.competitors||[];
        const hc = comps.find(c=>c.homeAway==='home'), ac = comps.find(c=>c.homeAway==='away');
        if (!hc||!ac) continue;
        const hs = parseInt(hc.score)||0, as_ = parseInt(ac.score)||0;
        const result = settleBet(bet, hs, as_);
        let newBal = profile.balance;
        if (result==='won') newBal += bet.potential_payout;
        else if (result==='push') newBal += bet.stake;
        await sb.from('bets').update({status:result,settled_at:new Date().toISOString()}).eq('id',bet.id);
        await sb.from('profiles').update({balance:newBal}).eq('id',user.id);
        profile.balance = newBal;
        if (result === 'won') {
          const profit = bet.potential_payout - bet.stake;
          showToast(`🏆 ${bet.selection} WON · +${fmt(profit)}`, 'success');
          launchConfetti();
          flashBalance('up');
        } else if (result === 'lost') {
          showToast(`${bet.selection} lost · -${fmt(bet.stake)}`, 'error');
          flashBalance('dn');
        }
        // Pulse the My Bets badge when a bet settles and user isn't viewing it
        if (currentView !== 'bets') {
          const curCount = parseInt(document.getElementById('betsBadge')?.textContent||'0')||0;
          updateBetsBadge(Math.max(0, curCount - 1), false);
        }
      }
    } catch(e) { console.error('settlement error',e); }
  }
  animateBalance(profile.balance);
}

function matchEvent(events, homeTeam, awayTeam) {
  const norm = s => s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').trim().split(' ').filter(Boolean);
  const htW = norm(homeTeam), atW = norm(awayTeam);
  for (const ev of events) {
    const cs = ev.competitions?.[0]?.competitors||[];
    const hc = cs.find(c=>c.homeAway==='home'), ac = cs.find(c=>c.homeAway==='away');
    if (!hc||!ac) continue;
    const hn = norm(hc.team?.displayName||''), an = norm(ac.team?.displayName||'');
    const htMatch = htW.some(w=>hn.includes(w))||hn.some(w=>htW.includes(w));
    const atMatch = atW.some(w=>an.includes(w))||an.some(w=>atW.includes(w));
    if (htMatch&&atMatch) return ev;
  }
  return null;
}

function settleBet(bet, homeScore, awayScore) {
  if (bet.market === 'h2h') {
    if (homeScore === awayScore) return 'push';
    const winner = homeScore > awayScore ? bet.home_team : bet.away_team;
    return winner === bet.selection ? 'won' : 'lost';
  }
  if (bet.market === 'spreads') {
    const line = parseFloat(bet.line), isHome = bet.selection === bet.home_team;
    const margin = homeScore - awayScore; // positive = home winning
    const covered = isHome ? (margin + line) : ((-margin) + (-line));
    if (covered > 0) return 'won'; if (covered < 0) return 'lost'; return 'push';
  }
  if (bet.market === 'totals') {
    const total = homeScore + awayScore, line = parseFloat(bet.line);
    if (bet.selection === 'Over') return total > line ? 'won' : total < line ? 'lost' : 'push';
    return total < line ? 'won' : total > line ? 'lost' : 'push';
  }
  return 'lost';
}

// ── LEADERBOARD ───────────────────────────────────────────────────
async function loadLeaderboard() {
  document.getElementById('lbInner').innerHTML = '<div class="loading"><div class="spinner"></div><span>Loading…</span></div>';
  let ids = null;
  if (currentRoom) {
    const { data: members } = await sb.from('room_members').select('user_id').eq('room_id', currentRoom.id);
    ids = members?.map(m=>m.user_id)||[];
    if (!ids.length) { document.getElementById('lbInner').innerHTML = '<div class="empty-state">No members yet — share your room code!</div>'; return; }
  }
  let q = sb.from('profiles').select('id,username,balance,created_at').order('balance',{ascending:false}).limit(100);
  if (ids) q = q.in('id', ids);
  const { data: rows } = await q;
  if (!rows?.length) { renderLeaderboard([]); return; }
  // Fetch settled bet stats for all players
  const userIds = rows.map(r=>r.id);
  const { data: betStats } = await sb.from('bets').select('user_id,status,stake,potential_payout').in('user_id', userIds).neq('status','pending');
  const statsByUser = {};
  for (const b of (betStats||[])) {
    if (!statsByUser[b.user_id]) statsByUser[b.user_id] = {wins:0,total:0,wagered:0,pnl:0};
    const s = statsByUser[b.user_id];
    s.total++;
    s.wagered += Number(b.stake);
    if (b.status==='won') { s.wins++; s.pnl += b.potential_payout - b.stake; }
    else if (b.status==='lost') { s.pnl -= b.stake; }
  }
  renderLeaderboard(rows||[], statsByUser);
}

function renderLeaderboard(rows, statsByUser={}) {
  const medals = ['🥇','🥈','🥉'];
  const title = currentRoom ? `🏠 ${esc(currentRoom.name)}` : '🌐 Global Leaderboard';
  const roomCode = currentRoom ? `<div class="lb-room-info"><span class="lb-code">Code: <b>${currentRoom.code}</b></span><button class="copy-code-btn" onclick="navigator.clipboard.writeText('${currentRoom.code}');showToast('Code copied!')">Copy</button></div>` : '';
  if (!rows.length) { document.getElementById('lbInner').innerHTML = '<div class="empty-state">No players yet.</div>'; return; }
  const rowsHtml = rows.map((p,i) => {
    const isMe = p.id === user.id;
    const pnl = p.balance - STARTING_BALANCE;
    const stats = statsByUser[p.id] || {wins:0,total:0,wagered:0,pnl:0};
    const winRate = stats.total > 0 ? Math.round(stats.wins/stats.total*100) : null;
    const rankDisplay = i < 3 ? medals[i] : `${i+1}`;
    return `<div class="lb-row ${isMe?'me':''}">
      <div class="lb-rank-num">${rankDisplay}</div>
      <div class="lb-avatar" style="background:${usernameGradient(p.username)}">${p.username[0].toUpperCase()}</div>
      <div class="lb-info">
        <div class="lb-name">${esc(p.username)}${isMe?'<span class="lb-you">you</span>':''}</div>
        <div class="lb-record">${stats.total > 0 ? `${stats.wins}W-${stats.total-stats.wins}L${winRate!==null?' · '+winRate+'%':''}` : 'No bets yet'}</div>
      </div>
      <div class="lb-right">
        <div class="lb-balance">${fmt(p.balance)}</div>
        <div class="lb-pnl ${pnl>=0?'pos':'neg'}">${pnl>=0?'+':''}${fmt(pnl)}</div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('lbInner').innerHTML = `<div class="lb-hdr"><h2 class="lb-title">${title}</h2>${roomCode}</div><div class="lb-list">${rowsHtml}</div>`;
}

// ── PROFILE VIEW ──────────────────────────────────────────────────
async function loadProfileView() {
  document.getElementById('profileInner').innerHTML = '<div class="loading"><div class="spinner"></div><span>Loading…</span></div>';
  const { data: bets } = await sb.from('bets').select('*').eq('user_id',user.id).order('created_at',{ascending:false});
  const all = bets||[];
  const settled = all.filter(b=>b.status!=='pending');
  const wins = settled.filter(b=>b.status==='won').length;
  const losses = settled.filter(b=>b.status==='lost').length;
  const total = settled.length;
  const pnl = settled.reduce((acc,b)=>acc+(b.status==='won'?b.potential_payout-b.stake:b.status==='lost'?-b.stake:0),0);
  const wagered = all.reduce((acc,b)=>acc+Number(b.stake),0);
  const roi = wagered > 0 ? ((pnl/wagered)*100).toFixed(1) : '0.0';
  const winRate = total > 0 ? Math.round(wins/total*100) : 0;
  const bestWin = settled.filter(b=>b.status==='won').reduce((best,b)=>{
    const profit = b.potential_payout - b.stake;
    return profit > best ? profit : best;
  }, 0);
  const biggestLoss = settled.filter(b=>b.status==='lost').reduce((worst,b)=>{
    return b.stake > worst ? b.stake : worst;
  }, 0);

  // Current streak
  let streak = 0, streakType = '';
  for (const b of settled) {
    if (b.status === 'push') continue;
    if (!streakType) { streakType = b.status; streak = 1; continue; }
    if (b.status === streakType) streak++; else break;
  }
  const streakLabel = streak > 0 ? `${streak} ${streakType === 'won' ? 'W' : 'L'}` : '—';
  const streakClass = streakType === 'won' ? 'pos' : streakType === 'lost' ? 'neg' : '';
  // Visual streak squares (last 10 settled bets)
  const recentResults = settled.slice(0,10).reverse();
  const streakSquares = recentResults.map(b=>{
    const col = b.status==='won' ? 'var(--win)' : b.status==='lost' ? 'var(--loss)' : 'var(--push)';
    const lbl = b.status==='won' ? 'W' : b.status==='lost' ? 'L' : 'P';
    return `<span style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:4px;background:${col}22;border:1px solid ${col}55;font-size:9px;font-weight:800;color:${col}">${lbl}</span>`;
  }).join('');
  const streakViz = recentResults.length ? `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;margin-bottom:4px">${streakSquares}</div>` : '';

  // Sport breakdown
  const sportCounts = {};
  for (const b of all) { sportCounts[b.sport] = (sportCounts[b.sport]||0)+1; }
  const topSports = Object.entries(sportCounts).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const sportBreakdown = topSports.length ? `
    <div class="profile-section-hdr">By Sport</div>
    <div class="sport-breakdown">${topSports.map(([s,n])=>`
      <div class="sb-row">
        <span class="sb-sport">${SPORTS[s]?.label||s}</span>
        <div class="sb-bar-wrap"><div class="sb-bar" style="width:${Math.round((n/all.length)*100)}%;background:${SPORT_ACCENTS[s]||'var(--gold)'}"></div></div>
        <span class="sb-count">${n}</span>
      </div>`).join('')}
    </div>` : '';

  document.getElementById('profileInner').innerHTML = `
    <div class="profile-hero">
      <div class="profile-avatar-big" style="background:${usernameGradient(profile?.username||'?')}">${(profile?.username||'?')[0].toUpperCase()}</div>
      <div class="profile-username">${esc(profile?.username||'Player')}</div>
      <div class="profile-since">Member since ${new Date(profile?.created_at||Date.now()).toLocaleDateString('en-US',{month:'long',year:'numeric'})}</div>
    </div>
    ${(() => {
      const tier = getTier(wagered);
      const next = nextTier(wagered);
      const pct = next ? Math.min(100, Math.round(((wagered - tier.min) / (next.min - tier.min)) * 100)) : 100;
      return `<div class="tier-card" style="border-color:${tier.color}22;background:${tier.color}08">
        <div class="tier-card-top">
          <span class="tier-icon">${tier.icon}</span>
          <div>
            <div class="tier-name" style="color:${tier.color}">${tier.name}</div>
            <div class="tier-sub">${next ? `${fmt(wagered)} wagered · ${fmt(next.min - wagered)} to ${next.name}` : `${fmt(wagered)} wagered · Max tier reached`}</div>
          </div>
        </div>
        ${next ? `<div class="tier-bar-wrap"><div class="tier-bar" style="width:${pct}%;background:${tier.color}"></div></div>` : ''}
      </div>`;
    })()}
    <div class="profile-section-hdr">Performance</div>
    <div class="stats-grid">
      <div class="stat-tile"><div class="st-val gold">${fmt(profile?.balance||0)}</div><div class="st-lbl">Balance</div></div>
      <div class="stat-tile"><div class="st-val ${pnl>=0?'pos':'neg'}">${pnl>=0?'+':''}${fmt(pnl)}</div><div class="st-lbl">P&amp;L</div></div>
      <div class="stat-tile"><div class="st-val">${winRate}%</div><div class="st-lbl">Win Rate</div></div>
      <div class="stat-tile"><div class="st-val ${parseFloat(roi)>=0?'pos':'neg'}">${parseFloat(roi)>=0?'+':''}${roi}%</div><div class="st-lbl">ROI</div></div>
      <div class="stat-tile"><div class="st-val ${streakClass}">${streakLabel}</div><div class="st-lbl">Streak</div></div>
      <div class="stat-tile"><div class="st-val">${total}</div><div class="st-lbl">Settled</div></div>
      <div class="stat-tile"><div class="st-val pos">${bestWin>0?'+'+fmt(bestWin):'—'}</div><div class="st-lbl">Best Win</div></div>
      <div class="stat-tile"><div class="st-val neg">${biggestLoss>0?'-'+fmt(biggestLoss):'—'}</div><div class="st-lbl">Worst Loss</div></div>
    </div>
    ${streakViz ? `<div class="profile-section-hdr">Last ${recentResults.length} Bets</div>${streakViz}` : ''}
    ${sportBreakdown}
    <div class="profile-section-hdr">P&amp;L History</div>
    <canvas id="pnlSparkline" class="pnl-sparkline"></canvas>
    <div class="profile-section-hdr">Recent Activity</div>
    <div class="txn-list">${all.slice(0,15).map(b=>{
      const isPending = b.status==='pending';
      const isWon = b.status==='won';
      const isLost = b.status==='lost';
      let label = 'Bet';
      try { const sel = JSON.parse(b.selection); if (sel.legs) label='Parlay'; else label=sel.team||b.market; } catch(e){}
      const sport = SPORTS[b.sport]?.label||b.sport||'Bet';
      const icon = isWon ? '✅' : isLost ? '❌' : '⏳';
      const amtClass = isWon ? 'pos' : isLost ? 'neg' : '';
      const amtStr = isWon ? '+'+fmt(b.potential_payout-b.stake) : isLost ? '-'+fmt(b.stake) : '-'+fmt(b.stake)+' (pending)';
      const ts = new Date(b.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric'});
      return `<div class="txn-row">
        <span class="txn-icon">${icon}</span>
        <div class="txn-info"><div class="txn-desc">${esc(label)} · ${sport}</div><div class="txn-date">${ts}</div></div>
        <div class="txn-amt ${amtClass}">${amtStr}</div>
      </div>`;
    }).join('') || '<div class="txn-empty">No bets placed yet</div>'}</div>
    <div class="responsible-note">🎮 This is a game. No real money involved. Play responsibly.</div>
    <button class="add-funds-btn-main" onclick="openAddFunds()">+ Add Virtual Funds</button>
    <button class="sign-out-btn" onclick="doSignOut()">Sign Out</button>`;
  // Draw sparkline after DOM render
  requestAnimationFrame(() => drawPnlSparkline(settled));
}

// ── NAVIGATION ────────────────────────────────────────────────────
function showView(view) {
  currentView = view;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('view-'+view)?.classList.add('active');
  document.querySelector(`.nav-tab[data-view="${view}"]`)?.classList.add('active');
  document.getElementById('sportTabs').style.display = view==='games'?'flex':'none';
  if (view==='games') loadGames(currentSport);
  else if (view==='bets') loadMyBets();
  else if (view==='leaderboard') loadLeaderboard();
  else if (view==='profile') loadProfileView();
}

function switchSport(tab) {
  document.querySelectorAll('.sport-tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
  // Apply sport accent color to the tab pill
  const sport = tab.dataset.sport;
  const accent = SPORT_ACCENTS[sport] || '#F5A623';
  tab.style.setProperty('--accent', accent);
  tab.style.setProperty('--accent-dim', accent + '18');
  // Clear search
  const s = document.getElementById('gamesSearch'); if (s) s.value = '';
  loadGames(sport);
}

let _allGames = [];
function filterGames(q) {
  if (!q.trim()) { renderGames(_allGames); return; }
  const t = q.toLowerCase();
  renderGames(_allGames.filter(g =>
    g.home_team.toLowerCase().includes(t) || g.away_team.toLowerCase().includes(t)
  ));
}

function updateBetsBadge(count, doPulse=false) {
  const badge = document.getElementById('betsBadge');
  if (!badge) return;
  if (count > 0) {
    badge.textContent = count; badge.style.display = 'inline-flex';
    if (doPulse) {
      badge.classList.remove('pulse');
      void badge.offsetWidth;
      badge.classList.add('pulse');
      setTimeout(() => badge.classList.remove('pulse'), 700);
    }
  } else badge.style.display = 'none';
}

function showAuth() {
  document.getElementById('authWrap').style.display='flex';
  document.getElementById('appWrap').style.display='none';
  startAuthParticles();
}
function showApp() {
  document.getElementById('authWrap').style.display='none';
  document.getElementById('appWrap').style.display='flex';
  loadGames(currentSport);
  // Welcome back toast after short delay so UI settles first
  setTimeout(() => {
    if (profile) showToast(`Welcome back, ${esc(profile.username)} · ${fmt(profile.balance)} ready to play`);
  }, 900);
}

// ── AUTH PARTICLE BACKGROUND ─────────────────────────────
let _authAnimId = null;
function startAuthParticles() {
  const canvas = document.getElementById('authCanvas');
  if (!canvas) return;
  if (_authAnimId) cancelAnimationFrame(_authAnimId);
  const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
  resize();
  window.addEventListener('resize', resize, {once:true});
  const ctx = canvas.getContext('2d');
  const N = 40;
  const pts = Array.from({length:N}, () => ({
    x: Math.random()*canvas.width, y: Math.random()*canvas.height,
    vx:(Math.random()-.5)*0.3, vy:(Math.random()-.5)*0.3,
    r:1+Math.random()*2, a:Math.random()
  }));
  const tick = () => {
    if (document.getElementById('authWrap').style.display==='none') return;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for (const p of pts) {
      p.x=(p.x+p.vx+canvas.width)%canvas.width;
      p.y=(p.y+p.vy+canvas.height)%canvas.height;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(245,166,35,${p.a*0.35})`; ctx.fill();
    }
    _authAnimId = requestAnimationFrame(tick);
  };
  tick();
}
</script>
